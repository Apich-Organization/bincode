[package]
name = "bincode_derive-next"
version = "3.0.0-rc.1"
# remember to update bincode
authors = [
    "Xinyu Yang <xinyu.yang@apich.org>",
    "Zoey Riordan <zoey@dos.cafe>",
    "Victor Koenders <bincode@trangar.com>",
    "The bincode-next & bincode developers",
]
edition = "2024"
rust-version = "1.85.0"

repository = "https://github.com/Apich-Organization/bincode"
documentation = "https://docs.rs/bincode_derive_next"
readme = "./readme.md"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]
license = "MIT"
description = "Implementation of #[derive(Encode, Decode)] for bincode-next"

[lib]
proc-macro = true

[features]
static-size = []
zero-copy = []

[lints.clippy]
empty-line-after-doc-comments = "allow"

[dependencies]
virtue = { version = "0.1.1", package = "virtue-next" }
