[package]
name = "bincode-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
futures = { version = "0.3", features = ["executor", "std"] }
tokio = { version = "1.52", features = ["full"] }
bincodev1 = { package = "bincode", version = "1.3.3" }
serde = { version = "1.0", features = ["derive"] }

[dependencies.bincode_next]
path = ".."
features = [
    "std",
    "serde",
    "derive",
    "zero-copy",
    "static-size",
    "async-fiber",
    "tokio",
    "fuzzing",
]
package = "bincode-next"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "compat"
path = "fuzz_targets/compat.rs"
test = false
doc = false

[[bin]]
name = "zero_copy"
path = "fuzz_targets/zero_copy.rs"
test = false
doc = false

[[bin]]
name = "sync_roundtrip"
path = "fuzz_targets/sync_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "async_fiber"
path = "fuzz_targets/async_fiber.rs"
test = false
doc = false
