name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: publishing
      url: https://crates.io/crates/bincode-next

    steps:
      # Pin actions/checkout v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin dtolnay/rust-toolchain (latest stable)
      - uses: dtolnay/rust-toolchain@8f51a215752c0199994f1c990a911762c5e5330a # master

      # Pin katyo/publish-crates v2.3.0
      - uses: katyo/publish-crates@5e676395995873941433020619623e114092b740 # v2.3.0
        with:
          registry-token: ${{ secrets.CRATES_IO_TOKEN }}
