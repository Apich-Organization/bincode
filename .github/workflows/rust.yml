name: Rust CI

on:
  push:
    branches: [trunk, main, "v*.x", "ci/*"]
  pull_request:
    branches: [trunk, main, "v*.x"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly, 1.90.0] # MSRV: 1.90.0
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: cargo check (all-features, all targets)
        run: cargo check --all-features --all-targets
      - name: cargo check (no_std, no alloc)
        run: cargo check --lib --no-default-features
      - name: cargo check (no_std + alloc)
        run: cargo check --lib --no-default-features --features alloc

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: cargo test (all features, incl. doc tests)
        run: cargo test --all-features
      - name: cargo test (default features)
        run: cargo test

  # Feature combinations: every optional feature on its own and in useful bundles.
  feature-matrix:
    name: Features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - std
          - std,derive
          - std,derive,serde
          - std,derive,zero-copy
          - std,derive,static-size
          - std,derive,async-fiber
          - std,derive,tokio
          - std,derive,simd
          - std,derive,hw-acceleration
          - std,derive,serde,zero-copy,static-size,async-fiber,tokio
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: cargo test
        run: cargo test --no-default-features --features ${{ matrix.features }} --lib --tests

  # The fuzz crate is its own workspace; make sure every target keeps compiling,
  # with and without SIMD, and that the fuzz-found regressions keep passing.
  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: |
            .
            fuzz
      - name: cargo check fuzz targets
        working-directory: fuzz
        run: cargo +nightly check --bins
      - name: cargo check fuzz targets (no SIMD)
        working-directory: fuzz
        run: cargo +nightly check --bins --no-default-features
      - name: cargo clippy fuzz targets
        working-directory: fuzz
        run: cargo +nightly clippy --bins
      - name: fuzz regression tests
        run: cargo test --test fuzz_regressions

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: cargo +nightly fmt
        run: cargo +nightly fmt --all -- --check
      - name: cargo +nightly fmt (fuzz workspace)
        working-directory: fuzz
        run: cargo +nightly fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets

  compatibility:
    name: Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412 # 1.90.0
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Run compatibility tests
        run: cargo test --manifest-path compatibility/Cargo.toml
