name: Cross-Platform CI

on:
  push:
    branches: [trunk, main, 'v*.x', 'ci/*']
  pull_request:
    branches: [trunk, main, 'v*.x']

env:
  CARGO_TERM_COLOR: always

jobs:
  test-zig:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            qemu_arch: aarch64
          - platform: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            qemu_arch: aarch64
          - platform: riscv64gc-unknown-linux-gnu
            zig_target: riscv64gc-unknown-linux-gnu.2.28
            qemu_arch: riscv64
          - platform: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            qemu_arch: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.platform }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Dependencies
        run: |
          cargo install cargo-zigbuild --locked
          sudo apt-get update && sudo apt-get install -y qemu-user-static

      - uses: Swatinem/rust-cache@v2

      - name: Run Tests
        shell: bash
        run: |
          # Create zig CC/CXX wrappers that translate Rust target triples to zig format
          # (e.g. x86_64-unknown-linux-musl -> x86_64-linux-musl)
          # This is needed because cc-rs adds --target=<rust-triple> which zig can't parse
          cat > /tmp/zig-cc << 'WRAPPER'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == --target=* ]]; then
              target="${arg#--target=}"
              target="$(echo "$target" | sed 's/-unknown//')"
              args+=("--target=$target")
            else
              args+=("$arg")
            fi
          done
          exec zig cc "${args[@]}"
          WRAPPER
          chmod +x /tmp/zig-cc

          cat > /tmp/zig-cxx << 'WRAPPER'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == --target=* ]]; then
              target="${arg#--target=}"
              target="$(echo "$target" | sed 's/-unknown//')"
              args+=("--target=$target")
            else
              args+=("$arg")
            fi
          done
          exec zig c++ "${args[@]}"
          WRAPPER
          chmod +x /tmp/zig-cxx

          export CC="/tmp/zig-cc"
          export CXX="/tmp/zig-cxx"
          
          ENV_NAME=$(echo ${{ matrix.platform }} | tr '[:lower:]-' '[:upper:]_')
          export CARGO_TARGET_${ENV_NAME}_LINKER="/tmp/zig-cc"

          if [ -n "${{ matrix.qemu_arch }}" ]; then
            export CARGO_TARGET_${ENV_NAME}_RUNNER="qemu-${{ matrix.qemu_arch }}-static"
          fi
          
          cargo zigbuild --target ${{ matrix.zig_target }} --all-features
          cargo test --target ${{ matrix.platform }} --all-features