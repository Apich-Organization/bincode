name: Benchmarks

on:
  push:
    branches: [main, master, "v*.x", "ci/*"]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "derive/**"
      - ".github/workflows/bench.yml"
  pull_request:
    branches: [main, master, "v*.x", "ci/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Criterion benchmarks ─────────────────────────────────────────────────
  build-bench:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Every bench target must compile, even those that are too slow/noisy to run on CI.
      - name: Build all benchmarks
        run: cargo bench --all-features --no-run

      - name: Run Criterion benchmarks
        run: >
          cargo bench --all-features
          --bench cbor_comparison --bench postcard_comparison --bench complex
          --bench deterministic --bench varint --bench inline --bench string

      - name: Upload criterion report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-report
          path: target/criterion
