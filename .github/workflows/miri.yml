name: Miri

on:
  push:
    branches: [trunk, main, "v*.x", "ci/*"]
  pull_request:
    branches: [trunk, main, "v*.x"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MIRIFLAGS: "-Zmiri-disable-isolation"

jobs:
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: cargo miri setup
        run: cargo miri setup
      - name: cargo miri test
        run: cargo miri test --all-features --no-fail-fast
